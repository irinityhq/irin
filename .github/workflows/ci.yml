      - name: Generate ledger key
        working-directory: gateway
        run: make ledger-key-dev

      - name: Two-leg provenance gate
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.run_gateway_smoke) ||
          (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-provenance'))
        working-directory: gateway
        env:
          COMPOSE_PROJECT_NAME: provtest-${{ github.run_id }}-${{ github.run_attempt }}
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
          AUTH_PEPPER: ci-test-pepper
        run: timeout --signal=TERM --kill-after=30s 20m make prove-provenance

      - name: Start gateway stack
        working-directory: gateway
        env:
          BOOTSTRAP_TOKEN: ci-bootstrap-token
          WATCH_DISPATCHER_ENABLED: "true"
          WATCH_PRODUCER_ENABLED: "false"
          WATCH_WORKER_ENABLED: "true"
          WATCH_DISPATCHER_GATEWAY_KEY: placeholder-key-to-allow-boot
          COUNCIL_GATEWAY_TOKEN: mock-council-token
          AUTH_PEPPER: ci-test-pepper
          WATCH_CANARY_TENANT: phase3-smoke
          COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
        run: |
          timeout --signal=TERM --kill-after=30s 10m bash <<'START_STACK'
          set -euo pipefail
          docker compose up -d --build
          healthy=false
          for i in {1..30}; do
            if curl -fsS http://localhost:18080/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          [[ "$healthy" == true ]]
          START_STACK

      - name: Provision internal credentials
        working-directory: gateway
        run: |
          timeout --signal=TERM --kill-after=30s 10m bash <<'PROVISION'
          set -eo pipefail
          for i in {1..30}; do
            if BOOTSTRAP_TOKEN=ci-bootstrap-token make provision-key BUDGET=phase3-smoke TIER=default RPM=1000 > provision_out.json 2>/dev/null; then
              RAW_KEY=$(jq -r '.raw_key' provision_out.json)
              if [ -n "$RAW_KEY" ] && [ "$RAW_KEY" != "null" ]; then
                break
              fi
            fi
            sleep 1
          done
          if [ -z "${RAW_KEY:-}" ] || [ "$RAW_KEY" = "null" ]; then
            echo "Failed to provision gateway key"
            cat provision_out.json || true
            exit 1
          fi
          cat <<ENV_EOF > .env
          BOOTSTRAP_TOKEN=ci-bootstrap-token
          GATEWAY_DURABLE=1
          WATCH_DISPATCHER_ENABLED=true
          WATCH_PRODUCER_ENABLED=false
          WATCH_WORKER_ENABLED=true
          WATCH_DISPATCHER_TICK_INTERVAL_MS=500
          WATCH_DISPATCHER_MAX_CLAIMS_PER_TICK=2
          WATCH_DISPATCHER_GATEWAY_KEY=$RAW_KEY
          COUNCIL_GATEWAY_TOKEN=mock-council-token
          AUTH_PEPPER=ci-test-pepper
          WATCH_CANARY_TENANT=phase3-smoke
          ENV_EOF
          docker compose down
          docker compose up -d
          for i in {1..30}; do
            if curl -fsS http://localhost:18080/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          [[ "${healthy:-false}" == true ]]
          PROVISION

      - name: Gateway metrics contract
        working-directory: gateway
        env:
          GW_URL: http://localhost:18080
        run: make metrics-contract

      - name: Run Phase 3 smoke
        working-directory: gateway
        env:
          PHASE3_SMOKE_COUNCIL_MODE: stub
          PHASE3_SMOKE_REBUILD_MODE: none
          PHASE3_SMOKE_FORCE_PROJECT: "1"
        run: timeout --signal=TERM --kill-after=30s 20m make smoke-phase3

      - name: Print Docker logs on failure
        if: failure()
        working-directory: gateway
        run: timeout --signal=TERM --kill-after=30s 2m docker compose logs --no-color || true

      - name: Tear down gateway stack
        if: always()
        working-directory: gateway
        run: |
          timeout --signal=TERM --kill-after=30s 3m docker compose down -v --remove-orphans || true
          rm -f .env provision_out.json

      - name: Run exact-source no-spend proof
        if: >
          !cancelled() &&
          github.repository == 'irinityhq/irin' &&
          github.event.repository.private == true &&
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.run_gateway_smoke)
          )
        env:
          COMPOSE_PROJECT_NAME: irin-verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEMO_SIDECAR_IMAGE_NAME: irin-verify-sidecar-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEMO_GATEWAY_IMAGE_NAME: irin-verify-gateway-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEMO_ALLOW_BUILD: "1"
          DEMO_PULL: "0"
        run: |
          test "${{ runner.environment }}" = "self-hosted"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          timeout --signal=TERM --kill-after=30s 60m make verify

      - name: Tear down exact-source proof
        if: >
          always() &&
          github.repository == 'irinityhq/irin' &&
          github.event.repository.private == true &&
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.run_gateway_smoke)
          )
        env:
          COMPOSE_PROJECT_NAME: irin-verify-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEMO_SIDECAR_IMAGE_NAME: irin-verify-sidecar-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          DEMO_GATEWAY_IMAGE_NAME: irin-verify-gateway-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 5m make verify-down
          cleanup_status=$?
          for resource in container volume network; do
            if [ -n "$(docker "$resource" ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")" ]; then
              echo "Exact-source $resource cleanup incomplete for $COMPOSE_PROJECT_NAME" >&2
              cleanup_status=1
            fi
          done
          for image in "$DEMO_SIDECAR_IMAGE_NAME" "$DEMO_GATEWAY_IMAGE_NAME"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm "$image" || cleanup_status=1
            fi
          done
          exit "$cleanup_status"

  # ---------------------------------------------------------------------------
  # W4 durable candidate jobs (do not collapse).
  # 1) PR isolation: ad-hoc candidate from branch HEAD; no shipping tier.
  # 2) Post-merge exact: rebuild for the squash/merge commit; export durable
  #    bundle. Candidate verified is reportable only after import + green
  #    aggregate — this job prints verification PASS only.
  # Never upload a local make ship-check receipt as a GitHub status.
  # ---------------------------------------------------------------------------
  candidate-isolation-proof:
    name: Candidate isolation proof (PR; no shipping tier)
    runs-on: macos-15
    timeout-minutes: 90
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.exact_candidate == 'true' &&
      github.event_name == 'pull_request'
    steps:
      # On pull_request, github.sha is the synthetic merge commit. Isolation
      # requires the ad-hoc candidate from branch HEAD
      # (github.event.pull_request.head.sha).
      - name: Checkout branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust and restore cache
        uses: ./.github/actions/rust-setup
        with:
          lane: warroom-tauri

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: council-rs/warroom/web/package-lock.json

      - name: Hermetic packaging + export/import + W5 method contracts
        run: |
          bash packaging/test-candidate-store.sh
          bash scripts/test-export-import-candidate.sh
          bash scripts/test-remove-worktree-evidence.sh
          bash scripts/test-publish-fake-gh.sh

      # Stream the full helper invocation into one non-hidden outer log
      # (ci-build-<sha>.log). Do not upload the helper-internal hidden
      # .ci-build-<sha>.log — upload-artifact excludes hidden files by
      # default, and early/late failures never land there. Parse summary
      # keys only after a zero exit. When exact_install=true, pass
      # --install so install-sensitive PRs get pre-merge install verification.
      - name: Build ad-hoc candidate from branch HEAD (no shipping tier)
        env:
          IRIN_CANDIDATE_ROOT: ${{ runner.temp }}/irin-candidates
          BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXACT_INSTALL: ${{ needs.detect-changes.outputs.exact_install }}
        run: |
          set -euo pipefail
          mkdir -p "$IRIN_CANDIDATE_ROOT"
          test "$(git rev-parse HEAD)" = "$BRANCH_HEAD_SHA"
          # Isolation contracts prove cross-SHA refuse; the build binds branch HEAD.
          # Non-hidden outer log: full helper stdout/stderr for success parse + failure artifact.
          outer_log="$IRIN_CANDIDATE_ROOT/ci-build-${BRANCH_HEAD_SHA}.log"
          {
            echo "CI_BUILD_LOG=$outer_log"
            echo "CI_BUILD_SOURCE_SHA=$BRANCH_HEAD_SHA"
            echo "BRANCH_HEAD_SHA=$BRANCH_HEAD_SHA"
          } >> "$GITHUB_ENV"
          args=(
            --source-sha "$BRANCH_HEAD_SHA"
            --export-dir "$IRIN_CANDIDATE_ROOT/.exports/${BRANCH_HEAD_SHA}"
          )
          if [[ "$EXACT_INSTALL" == "true" ]]; then
            args+=(--install)
          fi
          set +e
          bash scripts/ci-build-adhoc-candidate.sh "${args[@]}" 2>&1 | tee "$outer_log"
          build_ec=${PIPESTATUS[0]}
          set -e
          if [[ "$build_ec" -ne 0 ]]; then
            echo "ERROR: ci-build-adhoc-candidate failed (exit $build_ec); log=$outer_log" >&2
            if [[ -f "$outer_log" ]]; then
              echo "---- tail of retained outer build log ----" >&2
              tail -n 200 "$outer_log" >&2 || true
            fi
            exit "$build_ec"
          fi
          out="$(cat "$outer_log")"
          # Prefer <<< over echo|grep under pipefail: early match closes the
          # reader and SIGPIPEs the writer (Broken pipe on long multi-key logs).
          grep -q '^verification=PASS$' <<<"$out"
          grep -q '^shipping_tier_claim=none$' <<<"$out"
          grep -q "^source_sha=${BRANCH_HEAD_SHA}$" <<<"$out"
          if grep -Eiq \
            '^(tier:[[:space:]]*Candidate verified|shipping_tier_claim=Candidate verified)' \
            <<<"$out"; then
            echo "ERROR: isolation job must not claim Candidate verified" >&2
            exit 1
          fi
          {
            echo "## Candidate isolation proof (PR; no shipping tier)"
            echo ""
            echo "Branch HEAD (\`$BRANCH_HEAD_SHA\`) candidate is isolation evidence only — not a shipping tier."
            echo "exact_install=\`$EXACT_INSTALL\` (install-verify only when true)."
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # export + ad-hoc summary both print archive_path=; take first match only
          # so GITHUB_ENV stays KEY=value (multi-line values break the file command).
          # awk+exit avoids sed|head SIGPIPE under pipefail.
          kv() { awk -F= -v k="$2" 'index($0, k "=") == 1 { print substr($0, length(k) + 2); exit }' <<<"$1"; }
          archive="$(kv "$out" archive_path)"
          [[ -n "$archive" && -f "$archive" ]] || { echo "ERROR: missing archive_path" >&2; exit 1; }
          {
            echo "ARCHIVE_PATH=$archive"
            echo "EXPORT_MANIFEST=$(kv "$out" export_manifest)"
            echo "CANDIDATE_ID=$(kv "$out" candidate_id)"
            echo "ARCHIVE_SHA256=$(kv "$out" archive_sha256)"
          } >> "$GITHUB_ENV"

      # Only when the build step published CI_BUILD_LOG (skip if earlier steps failed).
      # Fail closed if the path was set but the outer log is missing.
      - name: Upload candidate build log on failure
        if: failure() && env.CI_BUILD_LOG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-log-${{ env.CI_BUILD_SOURCE_SHA || github.event.pull_request.head.sha }}
          path: ${{ env.CI_BUILD_LOG }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolation candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-isolation-${{ env.BRANCH_HEAD_SHA }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
            ${{ env.EXPORT_MANIFEST }}
          if-no-files-found: error
          retention-days: 14

  exact-merged-candidate:
    name: Exact merged candidate
    runs-on: macos-15
    timeout-minutes: 90
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.exact_candidate == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust and restore cache
        uses: ./.github/actions/rust-setup
        with:
          lane: warroom-tauri

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: council-rs/warroom/web/package-lock.json

      - name: Hermetic packaging + export/import + W5 method contracts
        run: |
          bash packaging/test-candidate-store.sh
          bash scripts/test-export-import-candidate.sh
          bash scripts/test-remove-worktree-evidence.sh
          bash scripts/test-publish-fake-gh.sh

      # Stream the full helper invocation into one non-hidden outer log
      # (ci-build-<sha>.log). Do not upload the helper-internal hidden
      # .ci-build-<sha>.log. Parse summary keys only after a zero exit.
      - name: Build exact merged-SHA candidate and export durable bundle
        env:
          IRIN_CANDIDATE_ROOT: ${{ runner.temp }}/irin-candidates
          EXACT_INSTALL: ${{ needs.detect-changes.outputs.exact_install }}
          MERGED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$IRIN_CANDIDATE_ROOT"
          # Non-hidden outer log: full helper stdout/stderr for success parse + failure artifact.
          outer_log="$IRIN_CANDIDATE_ROOT/ci-build-${MERGED_SHA}.log"
          {
            echo "CI_BUILD_LOG=$outer_log"
            echo "CI_BUILD_SOURCE_SHA=$MERGED_SHA"
          } >> "$GITHUB_ENV"
          args=(--export-dir "$IRIN_CANDIDATE_ROOT/.exports/${MERGED_SHA}" --source-sha "$MERGED_SHA")
          if [[ "$EXACT_INSTALL" == "true" ]]; then
            args+=(--install)
          fi
          set +e
          bash scripts/ci-build-adhoc-candidate.sh "${args[@]}" 2>&1 | tee "$outer_log"
          build_ec=${PIPESTATUS[0]}
          set -e
          if [[ "$build_ec" -ne 0 ]]; then
            echo "ERROR: ci-build-adhoc-candidate failed (exit $build_ec); log=$outer_log" >&2
            if [[ -f "$outer_log" ]]; then
              echo "---- tail of retained outer build log ----" >&2
              tail -n 200 "$outer_log" >&2 || true
            fi
            exit "$build_ec"
          fi
          out="$(cat "$outer_log")"
          # Prefer <<< over echo|grep under pipefail (early match → Broken pipe).
          # Same three exact markers as candidate-isolation before export/upload.
          grep -q '^verification=PASS$' <<<"$out"
          grep -q '^shipping_tier_claim=none$' <<<"$out"
          grep -q "^source_sha=${MERGED_SHA}$" <<<"$out"
          # Do not print Candidate verified: CI required includes this job and
          # is not green yet. After aggregate + import, candidate-status owns tier.
          if grep -Eiq \
            '^(tier:[[:space:]]*Candidate verified|shipping_tier_claim=Candidate verified)' \
            <<<"$out"; then
            echo "ERROR: exact-merged job must not claim Candidate verified" >&2
            exit 1
          fi
          # export + ad-hoc summary both print key= lines; take first match only.
          # awk+exit avoids sed|head SIGPIPE under pipefail.
          kv() { awk -F= -v k="$2" 'index($0, k "=") == 1 { print substr($0, length(k) + 2); exit }' <<<"$1"; }
          archive="$(kv "$out" archive_path)"
          manifest="$(kv "$out" export_manifest)"
          cid="$(kv "$out" candidate_id)"
          asha="$(kv "$out" archive_sha256)"
          payload="$(kv "$out" payload_tree_hash)"
          [[ -n "$archive" && -f "$archive" ]] || { echo "ERROR: missing archive_path" >&2; exit 1; }
          {
            echo "## Exact merged candidate"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| source_sha | \`$MERGED_SHA\` |"
            echo "| candidate_id | \`$cid\` |"
            echo "| archive_sha256 | \`$asha\` |"
            echo "| payload_tree_hash | \`$payload\` |"
            echo "| exact_install | \`$EXACT_INSTALL\` |"
            echo "| verification | PASS |"
            echo "| shipping_tier_claim | none (import + green CI required) |"
            echo ""
            echo "Import with:"
            echo '```bash'
            echo "scripts/import-candidate.sh --archive <downloaded.tar.gz> \\"
            echo "  --export-manifest <downloaded.export.json> \\"
            echo "  --expected-source-sha $MERGED_SHA \\"
            echo "  --expected-candidate-id $cid"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "ARCHIVE_PATH=$archive"
            echo "EXPORT_MANIFEST=$manifest"
            echo "CANDIDATE_ID=$cid"
            echo "ARCHIVE_SHA256=$asha"
          } >> "$GITHUB_ENV"

      # Only when the build step published CI_BUILD_LOG (skip if earlier steps failed).
      # Fail closed if the path was set but the outer log is missing.
      - name: Upload candidate build log on failure
        if: failure() && env.CI_BUILD_LOG != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-log-${{ env.CI_BUILD_SOURCE_SHA || github.sha }}
          path: ${{ env.CI_BUILD_LOG }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact merged candidate bundle (90-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-merged-candidate-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
            ${{ env.EXPORT_MANIFEST }}
          if-no-files-found: error
          retention-days: 90

  ci-required:
    name: CI required
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    if: always()
    needs:
      - actionlint
      - detect-changes
      - gitleaks
      - security-scanners
      - public-tree
      - public-pr-language
      - workspace-supply-chain
      - tauri-supply-chain
      - sbom
      - gateway-rust
      - council-rust
      - warroom-web
      - warroom-tauri
      - sentinel-rust
      - gateway-smoke
      - candidate-isolation-proof
      - exact-merged-candidate
    steps:
      # Always-on lanes must succeed. Path/event-selected lanes must succeed.
      # Unselected conditional lanes may skip. Never force every job green.
      - name: Require successful selected CI lanes
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATEWAY_RUST: ${{ needs.detect-changes.outputs.gateway_rust }}
          COUNCIL_RUST: ${{ needs.detect-changes.outputs.council_rust }}
          SENTINEL_RUST: ${{ needs.detect-changes.outputs.sentinel_rust }}
          WARROOM_WEB: ${{ needs.detect-changes.outputs.warroom_web }}
          WARROOM_TAURI: ${{ needs.detect-changes.outputs.warroom_tauri }}
          WORKSPACE_SUPPLY_CHAIN: ${{ needs.detect-changes.outputs.workspace_supply_chain }}
          TAURI_SUPPLY_CHAIN: ${{ needs.detect-changes.outputs.tauri_supply_chain }}
          SBOM: ${{ needs.detect-changes.outputs.sbom }}
          EXACT_CANDIDATE: ${{ needs.detect-changes.outputs.exact_candidate }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          RUN_GATEWAY_SMOKE: ${{ inputs.run_gateway_smoke }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          event = os.environ.get("EVENT_NAME", "")
          ref = os.environ.get("GITHUB_REF", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          private = os.environ.get("REPO_PRIVATE", "").lower() == "true"
          run_smoke = os.environ.get("RUN_GATEWAY_SMOKE", "false").lower() == "true"
          try:
              labels = json.loads(os.environ.get("PR_LABELS") or "[]")
          except json.JSONDecodeError:
              labels = []
          if not isinstance(labels, list):
              labels = []
          label_names = {str(x) for x in labels}

          def selected(flag: str) -> bool:
              return os.environ.get(flag, "") == "true"

          required = {
              "actionlint",
              "detect-changes",
              "gitleaks",
              "security-scanners",
              "public-tree",
              "public-pr-language",
          }
          if selected("GATEWAY_RUST"):
              required.add("gateway-rust")
          if selected("COUNCIL_RUST"):
              required.add("council-rust")
          if selected("SENTINEL_RUST"):
              required.add("sentinel-rust")
          if selected("WARROOM_WEB"):
              required.add("warroom-web")
          if selected("WARROOM_TAURI"):
              required.add("warroom-tauri")
          if selected("WORKSPACE_SUPPLY_CHAIN"):
              required.add("workspace-supply-chain")
          if selected("TAURI_SUPPLY_CHAIN"):
              required.add("tauri-supply-chain")
          if selected("SBOM"):
              required.add("sbom")

          # gateway-smoke mirrors its job-level if (scope + event gate).
          # Schedule requires canonical private main — same as the job if.
          schedule_smoke = (
              event == "schedule"
              and repo == "irinityhq/irin"
              and private
              and ref == "refs/heads/main"
          )
          if selected("GATEWAY_RUST") and (
              schedule_smoke
              or (event == "workflow_dispatch" and run_smoke)
              or (
                  event == "pull_request"
                  and (
                      "run-smoke" in label_names
                      or "run-provenance" in label_names
                  )
              )
          ):
              required.add("gateway-smoke")

          if selected("EXACT_CANDIDATE") and event == "pull_request":
              required.add("candidate-isolation-proof")
          if (
              selected("EXACT_CANDIDATE")
              and event == "push"
              and ref == "refs/heads/main"
          ):
              required.add("exact-merged-candidate")

          errors = []
          for name, info in sorted(needs.items()):
              result = info.get("result")
              if name in required:
                  if result != "success":
                      errors.append(f"{name}: required but result={result}")
              else:
                  if result not in ("success", "skipped"):
                      errors.append(f"{name}: unexpected result={result}")

          if errors:
              print("ci-required: selected-lane policy failed:", file=sys.stderr)
              for err in errors:
                  print(f"  {err}", file=sys.stderr)
              sys.exit(1)
          print(
              "ci-required: OK "
              f"(required={len(required)} total={len(needs)})"
          )
          PY
