name: IRIN CI

on:
  # Pull requests enter through ci-pr.yml, which calls this file from the
  # reviewed base pin (`ci.yml@main`), not from the PR head. Ordinary PR CI
  # therefore executes main's workflow revision; branch workflow_dispatch on
  # the PR tip is the explicit same-revision receipt for CI-changing PRs.
  # The runner predicate below keeps public and untrusted code on hosted
  # runners.
  # Do not add a top-level pull_request trigger here: that would dual-run a
  # second graph whose job names lack the protected `ci /` prefix. PR checks
  # report via the ci-pr.yml caller.
  workflow_call:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      run_gateway_smoke:
        description: "Run Gateway smoke/provenance plus private-main exact-source proof"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

# Concurrency split (PR B / #0008):
# - Main pushes share one non-cancelling group with queue:max so merge
#   receipts are retained up to GitHub's pending cap (100). Overflow beyond
#   that cap is cancelled; keep held-fix landing serial and watch the queue.
#   (Default pending depth without queue:max is 1 — a burst replaces older
#   pending path-scoped receipts.)
# - Superseded-PR cancellation lives on ci-pr.yml only. This reusable graph
#   never sets cancel-in-progress true — GitHub forbids combining that with
#   queue:max.
# - Schedule, manual, workflow_call, and non-main events use unique groups and
#   never join the main-push queue.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-main-push', github.workflow) || format('{0}-{1}-{2}-{3}', github.workflow, github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  actionlint:
    name: GitHub Actions lint
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned actionlint
        run: scripts/bootstrap-actionlint.sh

      - name: Validate GitHub Actions workflows
        # Wrapper ignores the pre-queue actionlint schema gap for concurrency.queue
        # while still failing closed on every other lint finding.
        run: scripts/run-actionlint.sh

  detect-changes:
    name: Detect CI scope
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      gateway_rust: ${{ steps.scope.outputs.gateway_rust }}
      council_rust: ${{ steps.scope.outputs.council_rust }}
      sentinel_rust: ${{ steps.scope.outputs.sentinel_rust }}
      warroom_web: ${{ steps.scope.outputs.warroom_web }}
      warroom_tauri: ${{ steps.scope.outputs.warroom_tauri }}
      workspace_supply_chain: ${{ steps.scope.outputs.workspace_supply_chain }}
      tauri_supply_chain: ${{ steps.scope.outputs.tauri_supply_chain }}
      sbom: ${{ steps.scope.outputs.sbom }}
      exact_candidate: ${{ steps.scope.outputs.exact_candidate }}
      exact_install: ${{ steps.scope.outputs.exact_install }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: scope
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            workflow_dispatch)
              changed=(__manual_dispatch__)
              ;;
            schedule)
              changed=(__scheduled_proof__)
              ;;
            push)
              # Path-scoped from the actual before...github.sha diff (not the
              # legacy __integrated_main__ full-matrix sentinel). A zero or
              # unavailable base fails safe to the full matrix.
              before="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ -z "$before" || "$before" =~ ^0+$ ]] \
                || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                changed=(__integrated_main__)
              else
                changed=()
                diff_output="$(git diff --name-only "$before...$head" --)"
                while IFS= read -r path; do
                  [[ -n "$path" ]] && changed+=("$path")
                done <<<"$diff_output"
                # Empty diff (e.g. empty commit) → no product lanes; keep
                # always-on light checks only (classifier with zero paths).
              fi
              ;;
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              if git cat-file -e "${base}^{commit}" 2>/dev/null; then
                changed=()
                diff_output="$(git diff --name-only "$base...$head" --)"
                while IFS= read -r path; do
                  [[ -n "$path" ]] && changed+=("$path")
                done <<<"$diff_output"
              else
                changed=(__unknown_base__)
              fi
              ;;
            *)
              changed=(__unknown_event__)
              ;;
          esac

          scripts/test-classify-ci-paths.sh
          # Hosted control-plane contracts (concurrency split, force-full,
          # exact-policy binding). Must run here so PR CI and branch
          # workflow_dispatch cannot go green without exercising them.
          scripts/test-ci-control-plane.sh
          # Hosted shipping-method hermetics (W2/W3). Path filters alone used
          # to select exact_candidate without ever executing these; same class
          # of defect as unhosted test-ci-control-plane.sh (#0018/#0043).
          # Zero network/Apple/provider — safe on every detect-changes run.
          scripts/test-candidate-status.sh
          scripts/test-release-transaction-w3.sh
          # Opt into exact_* so path-scoped candidate jobs see them. Classic
          # nine keys remain the default under Actions without this flag so a
          # base-controlled ci.yml@main that has not yet learned exact_* can
          # still classify a PR that adds the outputs.
          export IRIN_CLASSIFIER_INCLUDE_EXACT=1
          classifier_output="$(scripts/classify-ci-paths.sh "${changed[@]}")"
          expected_keys=(
            full_matrix gateway_rust council_rust sentinel_rust warroom_web
            warroom_tauri workspace_supply_chain tauri_supply_chain sbom
            exact_candidate exact_install
          )
          [[ "$(printf '%s\n' "$classifier_output" | sed '/^$/d' | wc -l | tr -d ' ')" == "${#expected_keys[@]}" ]]
          for key in "${expected_keys[@]}"; do
            [[ "$(printf '%s\n' "$classifier_output" | grep -Ec "^${key}=(true|false)$")" == 1 ]]
          done

          # Base-controlled exact_* overlay (workflow-inline). Do not trust the
          # PR checkout's classifier alone for isolation/exact gates — a PR can
          # rewrite that script to emit exact_candidate=false. Keep the case
          # arms in sync with scripts/classify-ci-paths.sh (enforced by
          # scripts/test-ci-control-plane.sh).
          # Markdown is light unless it is shipped pack/resource bytes.
          # Match packaging/gateway-pack/* and */resources/* before the *.md
          # refuse so a pack README cannot skip isolation.
          path_requires_exact_candidate() {
            case "$1" in
              packaging/gateway-pack/*|*/resources/*)
                return 0
                ;;
              *.md)
                return 1
                ;;
              packaging/*|\
              council-rs/warroom/web/*|\
              council-rs/warroom-tauri/*|\
              council-rs/src-tauri/*|\
              council-rs/scripts/warroom-*|\
              scripts/smoke-macos-tauri-app.sh|\
              scripts/macos-window-proof.swift|\
              scripts/stage-gateway-pack.sh|\
              scripts/build-gateway-pack-dev-images.sh|\
              scripts/build-gateway-pack-prod-images.sh|\
              scripts/generate-production-manifest.sh|\
              scripts/verify-production-image-provenance.sh|\
              scripts/test-gateway-pack-*.sh|\
              scripts/test-production-image-provenance.sh|\
              scripts/install-verify-candidate.sh|\
              scripts/release-transaction.sh|\
              scripts/test-release-transaction*.sh|\
              scripts/record-acceptance.sh|\
              scripts/candidate-status.sh|\
              scripts/test-candidate-status.sh|\
              scripts/ci-build-adhoc-candidate.sh|\
              scripts/export-candidate.sh|\
              scripts/import-candidate.sh|\
              scripts/test-export-import-candidate.sh|\
              scripts/classify-ci-paths.sh|\
              scripts/test-classify-ci-paths.sh|\
              scripts/test-ci-control-plane.sh|\
              gateway/lua/*|\
              gateway/nginx.conf|\
              gateway/conf/*|\
              .github/workflows/ci.yml|\
              .github/workflows/ci-pr.yml|\
              Makefile|\
              __manual_dispatch__|__scheduled_proof__|__integrated_main__|__unknown_base__|__unknown_event__)
                return 0
                ;;
            esac
            return 1
          }
          path_requires_exact_install() {
            case "$1" in
              packaging/gateway-pack/*|*/resources/*)
                return 0
                ;;
              *.md)
                return 1
                ;;
              packaging/build-dmg.sh|packaging/verify-dmg.sh|packaging/smoke-full-app.sh|packaging/smoke-gateway-pack.sh|packaging/build-app-bundle.sh|packaging/app-bundle-lock.sh|\
              scripts/stage-gateway-pack.sh|\
              scripts/build-gateway-pack-dev-images.sh|\
              scripts/build-gateway-pack-prod-images.sh|\
              scripts/generate-production-manifest.sh|\
              scripts/verify-production-image-provenance.sh|\
              scripts/test-gateway-pack-*.sh|\
              scripts/test-production-image-provenance.sh|\
              scripts/install-verify-candidate.sh|\
              gateway/lua/*|\
              gateway/nginx.conf|\
              gateway/conf/*|\
              Makefile|\
              __manual_dispatch__|__scheduled_proof__|__integrated_main__|__unknown_base__|__unknown_event__)
                return 0
                ;;
              council-rs/warroom-tauri/*|council-rs/src-tauri/*)
                case "$1" in
                  */resources/*|*gateway*|*pack*|*install*|*arm-attest*|*arm_*) return 0 ;;
                esac
                return 1
                ;;
            esac
            return 1
          }
          # Base-controlled full non-SBOM matrix when CI policy surfaces change.
          # Computed from the changed-path list in this workflow (base pin for
          # ordinary PRs), not from PR-produced classifier booleans — a hostile
          # classifier rewrite cannot suppress required lanes.
          path_forces_full_non_sbom_matrix() {
            case "$1" in
              .github/workflows/*|.github/actions/*|\
              */.github/workflows/*|*/.github/actions/*|\
              scripts/classify-ci-paths.sh|\
              scripts/test-classify-ci-paths.sh|\
              scripts/test-ci-control-plane.sh|\
              scripts/test-ci-candidate-observability.sh|\
              scripts/check-review-settlement.sh|\
              scripts/poll-review-settlement.sh|\
              scripts/run-actionlint.sh|\
              scripts/bootstrap-actionlint.sh|\
              __manual_dispatch__|__scheduled_proof__|__integrated_main__|__unknown_base__|__unknown_event__)
                return 0
                ;;
            esac
            return 1
          }
          exact_candidate=false
          exact_install=false
          force_full_non_sbom=false
          for path in "${changed[@]}"; do
            path_requires_exact_candidate "$path" && exact_candidate=true
            path_requires_exact_install "$path" && exact_install=true
            path_forces_full_non_sbom_matrix "$path" && force_full_non_sbom=true
          done
          # Overlay: workflow policy wins over PR-supplied classifier values.
          classifier_output="$(
            printf '%s\n' "$classifier_output" \
              | sed -e "s/^exact_candidate=.*/exact_candidate=${exact_candidate}/" \
                    -e "s/^exact_install=.*/exact_install=${exact_install}/"
          )"
          if [[ "$force_full_non_sbom" == true ]]; then
            classifier_output="$(
              printf '%s\n' "$classifier_output" \
                | sed -e 's/^full_matrix=.*/full_matrix=true/' \
                      -e 's/^gateway_rust=.*/gateway_rust=true/' \
                      -e 's/^council_rust=.*/council_rust=true/' \
                      -e 's/^sentinel_rust=.*/sentinel_rust=true/' \
                      -e 's/^warroom_web=.*/warroom_web=true/' \
                      -e 's/^warroom_tauri=.*/warroom_tauri=true/' \
                      -e 's/^workspace_supply_chain=.*/workspace_supply_chain=true/' \
                      -e 's/^tauri_supply_chain=.*/tauri_supply_chain=true/' \
                      -e 's/^exact_candidate=.*/exact_candidate=true/' \
                      -e 's/^exact_install=.*/exact_install=true/'
            )"
          fi

          printf '%s\n' "$classifier_output" | tee -a "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            printf '%s\n' "${changed[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'changed files:\n'
          printf '  %s\n' "${changed[@]}"

  gitleaks:
    name: Secret Scan (gitleaks, root)
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP/tools" -f "$RUNNER_TEMP/gitleaks.tgz" gitleaks
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/gitleaks" version

      - name: Run root tree secret scan
        run: gitleaks dir --config .gitleaks.toml --verbose .

  security-scanners:
    name: Security scanners (advisory)
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install unzip on hosted runners
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip

      - name: Verify unzip on self-hosted runners
        if: runner.environment == 'self-hosted'
        run: command -v unzip

      - name: Bootstrap pinned scanners
        run: scripts/bootstrap-dev-tools.sh

      # Fixture contracts reuse the bootstrap above (no second network install;
      # keep detect-changes offline/fast). Command-position step for reachability.
      - name: Opengrep boundary fixtures
        run: |
          scripts/test-opengrep-fixtures.sh

      - name: Opengrep (advisory findings)
        run: scripts/run-opengrep.sh

      - name: Selene Lua (advisory findings)
        run: scripts/run-selene.sh

      - name: Upload scanner findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-scanner-findings
          # Findings live under gitignored .irin-tools/ — v4+ excludes hidden
          # paths unless this is set (otherwise the artifact is empty).
          include-hidden-files: true
          path: |
            .irin-tools/findings/opengrep-*.json
            .irin-tools/findings/opengrep-*.sarif
          if-no-files-found: warn
          retention-days: 14

  public-tree:
    name: Public tree
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install public-tree scanner on hosted runners
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Verify public-tree scanner on self-hosted runners
        if: runner.environment == 'self-hosted'
        run: command -v rg

      - name: Verify public source-tree boundaries
        run: scripts/check-public-tree.sh

  public-pr-language:
    name: Public PR language
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    needs: detect-changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Self-test checker
        run: scripts/check-public-pr-language.sh --self-test

      - name: Self-test test-weakening tripwire
        run: |
          bash scripts/test-check-test-weakening.sh

      - name: Test-weakening tripwire
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The override must be stated in the PR description as a line
          # "Test-weakening-ack: <reason>"; it is echoed into the job log.
          ack="$(printf '%s\n' "${PR_BODY}" | sed -n 's/^Test-weakening-ack:[[:space:]]*//p' | head -n 1)"
          IRIN_TEST_WEAKENING_ACK="${ack}" bash scripts/check-test-weakening.sh "${BASE_SHA}"

      - name: Check PR title, body, and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [[ "${PR_AUTHOR}" == "dependabot[bot]" ]]; then
            PR_BODY="${PR_BODY//\/home\/runner\/.cargo\/advisory-db/[dependabot-cargo-advisory-db]}"
          fi
          scripts/check-public-pr-language.sh \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --title "${PR_TITLE}" \
            --body-env PR_BODY

      - name: Check contract-surface declaration (advisory)
        if: github.event_name == 'pull_request'
        env:
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "${CHANGED_FILES}" > "$RUNNER_TEMP/changed-files.txt"
          scripts/check-contract-surface-declaration.sh \
            --files-file "$RUNNER_TEMP/changed-files.txt" \
            --body-env PR_BODY

      - name: Check proof tip commit
        if: github.event_name != 'pull_request'
        run: scripts/check-public-pr-language.sh --range "0000000000000000000000000000000000000000..${{ github.sha }}"

  workspace-supply-chain:
    name: Workspace Cargo Audit and Deny
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.workspace_supply_chain == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust and restore cache
        uses: ./.github/actions/rust-setup
        with:
          lane: workspace-supply-chain

      - name: Install supply-chain tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/cargo-audit.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xz --strip-components=1 -C "$RUNNER_TEMP/tools" --wildcards '*/cargo-audit' -f "$RUNNER_TEMP/cargo-audit.tgz"
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz"
          echo "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xz --strip-components=1 -C "$RUNNER_TEMP/tools" --wildcards '*/cargo-deny' -f "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/cargo-audit" --version
          "$RUNNER_TEMP/tools/cargo-deny" --version

      - name: Run workspace cargo audit
        run: cargo-audit audit -D warnings --ignore RUSTSEC-2024-0436

      - name: Run workspace cargo deny
        run: cargo-deny check

  tauri-supply-chain:
    name: Tauri Cargo Audit and Deny
    runs-on: ${{ fromJSON(github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'iws17')) && '{"group":"IRIN trusted main","labels":"irin-ci"}' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    needs: detect-changes
    if: needs.detect-changes.outputs.tauri_supply_chain == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust and restore cache
        uses: ./.github/actions/rust-setup
        with:
          lane: tauri-supply-chain

      - name: Install supply-chain tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/cargo-audit.tgz" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xz --strip-components=1 -C "$RUNNER_TEMP/tools" --wildcards '*/cargo-audit' -f "$RUNNER_TEMP/cargo-audit.tgz"
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.9/cargo-deny-0.19.9-x86_64-unknown-linux-musl.tar.gz"
          echo "f1f8eedc2a3ac297c540873f93785d4104b102c0079506b2a6b3221b7ec956af  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xz --strip-components=1 -C "$RUNNER_TEMP/tools" --wildcards '*/cargo-deny' -f "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Run Tauri cargo audit
        run: |
          cargo-audit audit \
            -D unsound \
            --file council-rs/warroom-tauri/src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2024-0429

      - name: Run Tauri cargo deny
        run: cargo-deny --manifest-path council-rs/warroom-tauri/src-tauri/Cargo.toml check --config deny.toml

