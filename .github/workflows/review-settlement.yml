name: Review settlement

# Required-check producer (issue #0101 / PR #70 class; #0104–#0106).
# Fail closed while reviewRequests is nonempty, when a non-dismissed
# opinionated review (APPROVED / CHANGES_REQUESTED) is not bound to the
# current headRefOid, or when CHANGES_REQUESTED is active. COMMENTED reviews
# are advisory and never gate: bots do not re-review every push, so
# head-binding COMMENTED deadlocks until a nudge commit (PR #73–#87 batch).
# GraphQL connections are first:100 with pageInfo.hasNextPage; any
# truncated page fails closed (never SETTLED).
#
# Review threads are NOT evaluated here. GitHub emits no supported Actions
# event when a conversation is resolved, so a custom required check cannot
# refresh on resolve without a second control plane. Required
# conversation-resolution on main owns thread blocking; do not re-implement
# it in this job.
#
# This is a stable required-check *producer*. Register the exact job name
# "Review settlement" in branch protection only after the context has
# appeared on a real PR (do not rename lightly).
#
# Boundary GitHub cannot enforce natively with required_approving_review_count=0:
# pending review *requests* do not block merge. This check is the smallest
# enforceable layer for that gap, reusing the existing required-status-check
# mechanism (not a second control plane).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read

# pull_request and pull_request_review both expose github.event.pull_request.number.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-settlement:
    name: Review settlement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pull request number
        id: pr
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request and pull_request_review both carry the PR at the root
          # payload path github.event.pull_request (not under the review object).
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          number=""
          case "$EVENT_NAME" in
            pull_request|pull_request_review)
              number="${PR_NUMBER:-}"
              ;;
            *)
              printf 'ERROR: unsupported event %q\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            printf 'ERROR: invalid PR number %q\n' "$number" >&2
            exit 1
          fi
          echo "number=$number" >>"$GITHUB_OUTPUT"
          printf 'Evaluating review settlement for PR #%s\n' "$number"

      - name: Evaluate review settlement on current head
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        # The Copilot auto-review ruleset (review_on_push) re-requests a
        # review on every push, so settlement is structurally unsettled for
        # the Copilot latency window after each commit. The poll wrapper
        # retries not-settled (exit 1) until its deadline; exit 2
        # (usage/transport/schema/truncated) stays an immediate hard fail.
        # A newer push or a submitted review cancels this run via the
        # concurrency group and re-evaluates fresh. The wrapper invokes
        # scripts/check-review-settlement.sh single-shot per probe.
        run: scripts/poll-review-settlement.sh --owner "$OWNER" --repo "$REPO_NAME" --pr "$PR_NUMBER"
