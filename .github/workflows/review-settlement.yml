name: Review settlement

# Pre-queue review settlement gate (issue #0101 / PR #70 class).
# Fail closed while reviewRequests is nonempty, when a non-dismissed latest
# review is not bound to the current headRefOid, when CHANGES_REQUESTED is on
# head, or when actionable review threads remain unresolved.
#
# This is a stable required-check *producer*. Register the exact job name
# "Review settlement" in branch protection / the main merge-queue ruleset only
# after the context has appeared on a real PR (do not rename lightly).
#
# Boundary GitHub cannot enforce natively with required_approving_review_count=0:
# pending review *requests* do not block merge/queue. Conversation resolution
# covers open threads once they exist but does not wait for a requested review
# to land. This check is the smallest enforceable layer for that gap, reusing
# the existing required-status-check / merge-queue mechanism (not a second
# control plane).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  # Merge queue must report the protected `Review settlement` context.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

# PR updates cancel; merge_group must not cancel (same split as dependency-review).
concurrency:
  group: ${{ github.event_name == 'merge_group' && format('{0}-merge-group-{1}', github.workflow, github.event.merge_group.head_sha) || format('{0}-pr-{1}', github.workflow, github.event.pull_request.number || github.event.pull_request_review.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  review-settlement:
    name: Review settlement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pull request number
        id: pr
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request_review.pull_request.number }}
          MERGE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          number=""
          case "$EVENT_NAME" in
            pull_request)
              number="${PR_NUMBER:-}"
              ;;
            pull_request_review)
              number="${REVIEW_PR_NUMBER:-}"
              ;;
            merge_group)
              # head_ref looks like:
              #   refs/heads/gh-readonly-queue/main/pr-70-<sha>
              # or without the refs/heads/ prefix depending on payload shape.
              ref="${MERGE_HEAD_REF:-}"
              if [[ "$ref" =~ /pr-([0-9]+)- ]]; then
                number="${BASH_REMATCH[1]}"
              elif [[ "$ref" =~ pr-([0-9]+)- ]]; then
                number="${BASH_REMATCH[1]}"
              else
                printf 'ERROR: cannot parse PR number from merge_group head_ref=%q\n' "$ref" >&2
                exit 1
              fi
              ;;
            *)
              printf 'ERROR: unsupported event %q\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ ! "$number" =~ ^[0-9]+$ ]]; then
            printf 'ERROR: invalid PR number %q\n' "$number" >&2
            exit 1
          fi
          echo "number=$number" >>"$GITHUB_OUTPUT"
          printf 'Evaluating review settlement for PR #%s\n' "$number"

      - name: Evaluate review settlement on current head
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: scripts/check-review-settlement.sh --owner "$OWNER" --repo "$REPO_NAME" --pr "$PR_NUMBER"
