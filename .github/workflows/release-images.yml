name: release-images

# Manual / non-publication image build lane only.
#
# W3: git-tag push no longer triggers this workflow. Publication promotes the
# candidate's exact Gateway/sidecar digest refs to immutable vX.Y.Z labels
# inside scripts/release-transaction.sh --publish, which has the candidate
# manifest. A tag-triggered rebuild would not have that manifest and must not
# pretend to receipt publication.
#
# Operators may still run this workflow manually for ad-hoc image builds that
# are outside publication authority.

on:
  workflow_dispatch:
    inputs:
      images_tag:
        description: "Image tag to publish (vX.Y.Z or rc-<sha12>)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.inputs.images_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push Gateway Pack images (linux/arm64; non-publication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Bind privileged execution to reviewed main history
        env:
          TAG_NAME: ${{ github.event.inputs.images_tag }}
        run: |
          git fetch origin main
          # For v* tags that exist as git tags, require ancestry. For rc-* or
          # free-form manual tags, require HEAD is on main.
          if git rev-parse "${TAG_NAME}^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "${TAG_NAME}^{commit}")"
            git merge-base --is-ancestor "$TAG_COMMIT" origin/main \
              || { echo "ERROR: $TAG_NAME is not reachable from reviewed main history; refusing"; exit 1; }
          else
            HEAD="$(git rev-parse HEAD)"
            git merge-base --is-ancestor "$HEAD" origin/main \
              || { echo "ERROR: workflow HEAD is not on origin/main; refusing"; exit 1; }
          fi

      - name: Publish images (outside publication authority)
        env:
          IRIN_PACK_IMAGES_TAG: ${{ github.event.inputs.images_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/build-gateway-pack-prod-images.sh

      - name: Upload digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pack-images-${{ github.event.inputs.images_tag }}
          path: packaging/build/gateway-pack/pushed-images-*.env
          retention-days: 90
