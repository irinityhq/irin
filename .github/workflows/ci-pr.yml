name: IRIN CI PR dispatcher

on:
  # No workflow-level paths-ignore: the reusable graph must report its light
  # checks and aggregate context even for documentation-only pull requests.
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  # Base-controlled graph: runner selection predicates live in reviewed main.
  # Do not switch this to `uses: ./.github/workflows/ci.yml` — a PR could then
  # rewrite runs-on and the trusted self-hosted guard in one commit.
  ci:
    uses: irinityhq/irin/.github/workflows/ci.yml@main

  # ---------------------------------------------------------------------------
  # W4 bootstrap (hosted-only). Until the isolation job lands on main via the
  # pin above, packaging-touching PRs still need a pre-merge isolation lane.
  # This job is defined in the dispatcher with hard-coded GitHub-hosted
  # runners only (macos-15 / ubuntu-latest). It never uses the trusted
  # self-hosted runner group expression from ci.yml.
  #
  # Branch protection must require the check context named below:
  #   "W4 isolation bootstrap required"
  # until W4's isolation job is required via `ci / CI required` on main.
  # ---------------------------------------------------------------------------
  w4-bootstrap-scope:
    name: W4 bootstrap scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exact_candidate: ${{ steps.scope.outputs.exact_candidate }}
      has_w4_scripts: ${{ steps.scope.outputs.has_w4_scripts }}
      branch_head_sha: ${{ steps.scope.outputs.branch_head_sha }}
    steps:
      # Diff only: do not execute PR scripts for the isolation gate. Path policy
      # is inlined below so a PR cannot suppress exact_candidate by rewriting
      # scripts/classify-ci-paths.sh. (After W4 lands, ci.yml@main owns the same
      # overlay; this bootstrap is the temporary required check.)
      - name: Checkout base+head for path list only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: scope
        name: Base-controlled isolation path gate (no PR script execution)
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$head"

          # Workflow-inline isolation surface. Keep in sync with the exact_*
          # arms in scripts/classify-ci-paths.sh plus transfer/policy scripts
          # that must not skip macOS isolation when changed alone.
          path_requires_exact_candidate() {
            case "$1" in
              packaging/*|\
              council-rs/warroom/web/*|\
              council-rs/warroom-tauri/*|\
              council-rs/src-tauri/*|\
              council-rs/scripts/warroom-*|\
              scripts/smoke-macos-tauri-app.sh|\
              scripts/macos-window-proof.swift|\
              scripts/stage-gateway-pack.sh|\
              scripts/build-gateway-pack-dev-images.sh|\
              scripts/build-gateway-pack-prod-images.sh|\
              scripts/generate-production-manifest.sh|\
              scripts/verify-production-image-provenance.sh|\
              scripts/test-gateway-pack-*.sh|\
              scripts/test-production-image-provenance.sh|\
              scripts/install-verify-candidate.sh|\
              scripts/release-transaction.sh|\
              scripts/test-release-transaction*.sh|\
              scripts/record-acceptance.sh|\
              scripts/candidate-status.sh|\
              scripts/test-candidate-status.sh|\
              scripts/ci-build-adhoc-candidate.sh|\
              scripts/export-candidate.sh|\
              scripts/import-candidate.sh|\
              scripts/test-export-import-candidate.sh|\
              scripts/classify-ci-paths.sh|\
              scripts/test-classify-ci-paths.sh|\
              .github/workflows/ci.yml|\
              .github/workflows/ci-pr.yml|\
              Makefile)
                return 0
                ;;
            esac
            return 1
          }

          exact_candidate=false
          if git cat-file -e "${base}^{commit}" 2>/dev/null; then
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              if path_requires_exact_candidate "$path"; then
                exact_candidate=true
                break
              fi
            done < <(git diff --name-only "$base...$head" --)
          else
            # Unknown base: fail closed to isolation.
            exact_candidate=true
          fi

          has_w4=false
          if [[ -x scripts/ci-build-adhoc-candidate.sh \
            && -x scripts/export-candidate.sh \
            && -x scripts/import-candidate.sh \
            && -x scripts/test-export-import-candidate.sh \
            && -x packaging/test-candidate-store.sh ]]; then
            has_w4=true
          fi

          # Isolation-required paths must not silently skip macOS by deleting
          # the scripts that implement the lane.
          if [[ "$exact_candidate" == "true" && "$has_w4" != "true" ]]; then
            echo "ERROR: isolation-required paths changed but W4 candidate scripts are missing or not executable" >&2
            exit 1
          fi

          {
            echo "exact_candidate=${exact_candidate}"
            echo "has_w4_scripts=${has_w4}"
            echo "branch_head_sha=${head}"
          } >> "$GITHUB_OUTPUT"
          printf 'exact_candidate=%s has_w4_scripts=%s head=%s\n' \
            "$exact_candidate" "$has_w4" "$head"

  w4-isolation-bootstrap-hermetic:
    name: Candidate isolation proof (PR bootstrap; hermetic hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: w4-bootstrap-scope
    if: needs.w4-bootstrap-scope.outputs.has_w4_scripts == 'true'
    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Hermetic W4 export/import + classifier contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          bash scripts/test-classify-ci-paths.sh
          bash packaging/test-candidate-store.sh
          out="$(bash scripts/test-export-import-candidate.sh 2>&1)"
          printf '%s\n' "$out"
          # Match claim-shaped lines only; PASS messages may name the tier.
          if echo "$out" | grep -Eiq \
            '^(tier:[[:space:]]*Candidate verified|shipping_tier_claim=Candidate verified)'; then
            echo "ERROR: hermetic bootstrap must not claim Candidate verified" >&2
            exit 1
          fi

  w4-isolation-bootstrap-macos:
    name: Candidate isolation proof (PR bootstrap; macos-15 hosted only)
    # Hard-coded GitHub-hosted runner. No self-hosted expression. No runner group.
    runs-on: macos-15
    timeout-minutes: 90
    needs: w4-bootstrap-scope
    if: >
      needs.w4-bootstrap-scope.outputs.has_w4_scripts == 'true' &&
      needs.w4-bootstrap-scope.outputs.exact_candidate == 'true'
    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust and restore cache
        uses: ./.github/actions/rust-setup
        with:
          lane: warroom-tauri

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: council-rs/warroom/web/package-lock.json

      - name: Hermetic contracts then ad-hoc candidate (no shipping tier)
        env:
          IRIN_CANDIDATE_ROOT: ${{ runner.temp }}/irin-candidates
          BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$IRIN_CANDIDATE_ROOT"
          test "$(git rev-parse HEAD)" = "$BRANCH_HEAD_SHA"
          bash packaging/test-candidate-store.sh
          bash scripts/test-export-import-candidate.sh
          out="$(bash scripts/ci-build-adhoc-candidate.sh \
            --source-sha "$BRANCH_HEAD_SHA" \
            --export-dir "$IRIN_CANDIDATE_ROOT/.exports/${BRANCH_HEAD_SHA}")"
          printf '%s\n' "$out"
          echo "$out" | grep -q '^verification=PASS$'
          echo "$out" | grep -q '^shipping_tier_claim=none$'
          echo "$out" | grep -q "^source_sha=${BRANCH_HEAD_SHA}$"
          if echo "$out" | grep -Eiq \
            '^(tier:[[:space:]]*Candidate verified|shipping_tier_claim=Candidate verified)'; then
            echo "ERROR: bootstrap must not claim Candidate verified" >&2
            exit 1
          fi
          {
            echo "## W4 isolation bootstrap (hosted only; no shipping tier)"
            echo ""
            echo "Branch HEAD: \`$BRANCH_HEAD_SHA\` (not the PR merge SHA)."
            echo "Base-controlled \`ci.yml@main\` does not yet own this lane on unmerged"
            echo "graphs. This job runs only on GitHub-hosted macos-15."
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          archive="$(echo "$out" | sed -n 's/^archive_path=//p')"
          manifest="$(echo "$out" | sed -n 's/^export_manifest=//p')"
          {
            echo "ARCHIVE_PATH=$archive"
            echo "EXPORT_MANIFEST=$manifest"
            echo "BRANCH_HEAD_SHA=$BRANCH_HEAD_SHA"
          } >> "$GITHUB_ENV"

      - name: Upload bootstrap isolation archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-isolation-bootstrap-${{ env.BRANCH_HEAD_SHA }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256
            ${{ env.EXPORT_MANIFEST }}
          if-no-files-found: error
          retention-days: 14

  # Required check context name (must be listed in branch protection on main
  # during the W4 bootstrap window). After W4 lands on main and isolation is
  # part of `ci / CI required`, this context may be demoted.
  w4-isolation-bootstrap-required:
    name: W4 isolation bootstrap required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - w4-bootstrap-scope
      - w4-isolation-bootstrap-hermetic
      - w4-isolation-bootstrap-macos
    steps:
      - name: Require isolation when path gate says so (skip is not success)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          scope_result="$(jq -r '.["w4-bootstrap-scope"].result' <<<"$NEEDS")"
          exact="$(jq -r '.["w4-bootstrap-scope"].outputs.exact_candidate // "false"' <<<"$NEEDS")"
          hermetic="$(jq -r '.["w4-isolation-bootstrap-hermetic"].result' <<<"$NEEDS")"
          macos="$(jq -r '.["w4-isolation-bootstrap-macos"].result' <<<"$NEEDS")"

          [[ "$scope_result" == "success" ]] \
            || { echo "ERROR: w4-bootstrap-scope result=$scope_result" >&2; exit 1; }

          if [[ "$exact" == "true" ]]; then
            # Path gate selected isolation: skipped is failure, not green.
            [[ "$hermetic" == "success" ]] \
              || { echo "ERROR: hermetic bootstrap required (got $hermetic)" >&2; exit 1; }
            [[ "$macos" == "success" ]] \
              || { echo "ERROR: macOS isolation required when exact_candidate=true (got $macos)" >&2; exit 1; }
          else
            [[ "$hermetic" == "success" || "$hermetic" == "skipped" ]] \
              || { echo "ERROR: hermetic bootstrap failed ($hermetic)" >&2; exit 1; }
            [[ "$macos" == "success" || "$macos" == "skipped" ]] \
              || { echo "ERROR: macOS isolation failed ($macos)" >&2; exit 1; }
          fi
          echo "W4 isolation bootstrap required: ok (exact_candidate=$exact)"
