name: IRIN CI PR dispatcher

on:
  # No workflow-level paths-ignore: the reusable graph must report its light
  # checks and aggregate context even for documentation-only pull requests.
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  ci:
    # Call the reusable graph from *this PR revision* (not @main) so new jobs
    # and aggregate deps introduced on the PR — including W4 Candidate isolation
    # proof — self-test before merge. Previously `uses: …/ci.yml@main` meant a
    # PR that added isolation/exact-merge jobs could never run them until after
    # merge, so the cumulative shipping-correction PR could not demonstrate the
    # required pre-merge isolation lane.
    #
    # Runner safety: selection stays fail-closed inside ci.yml (hosted for
    # untrusted/public/fork; trusted self-hosted only for private same-repo PRs
    # authored by iws17). Do not weaken those predicates when editing ci.yml.
    # Local reusable workflow resolves to the same commit as this dispatcher.
    uses: ./.github/workflows/ci.yml
