# IRIN Desktop Gateway Pack — runtime-only Compose.
# Fixed project name is enforced by the native host: irin-desktop-gateway
# No build: directives. No host-home mounts. No canary overlay.
# Image refs come from IRIN_GATEWAY_IMAGE / IRIN_SIDECAR_IMAGE (digest-pinned).
# Pack root + ledger key paths are set only by the native allow-listed host.
# Compose ranks process env above --env-file: every interpolated variable
# below is forced by the native spawn env from validated sources. Watch
# producer/dispatcher and the Council-spend token stay empty literals that
# accept no env input; the watch-admin read token is interpolated from the
# validated native spawn env (ambient host values are scrubbed; the
# Keychain-held value is never written to the public env file).

name: irin-desktop-gateway

services:
  gateway:
    image: ${IRIN_GATEWAY_IMAGE:?IRIN_GATEWAY_IMAGE must be a digest-pinned image ref}
    volumes:
      # Quote paths: Application Support (and IRIN_APP_SUPPORT_ROOT tests) contain spaces.
      - "${IRIN_DESKTOP_PACK_ROOT}/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro"
      - "${IRIN_DESKTOP_PACK_ROOT}/conf:/usr/local/openresty/nginx/conf/conf:ro"
      - "${IRIN_DESKTOP_PACK_ROOT}/lua:/usr/local/openresty/nginx/lua:ro"
      - irin_desktop_sidecar_sock:/run/sidecar
      # Desktop-only arm-bridge signal. Empty non-secret marker; the actual
      # root-owned 0600 registry is mounted only into the validating sidecar.
      - "${IRIN_DESKTOP_PACK_ROOT}/arm-bridge-enabled:/run/irin-features/arm-bridge-enabled:ro"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      - XAI_API_KEY=${XAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      # Vertex deliberately unsupported in pack isolation (no host ADC mount).
      - VERTEX_PROJECT=
      - VERTEX_LOCATION=
      - VERTEX_GEMINI_MODEL=
      - "SIDECAR_ADDR=unix:/run/sidecar/sidecar.sock:"
      - SIDECAR_TIMEOUT_MS=200
      # Claude/Codex host adapters: native host injects host-reachable URL +
      # Keychain token when app-owned adapters are healthy; empty keeps the
      # provider fail-closed (never silent Direct fallthrough). Gemini remains
      # unproductized (empty literals).
      - CLAUDE_PROXY_URL=${CLAUDE_PROXY_URL:-}
      - CODEX_PROXY_URL=${CODEX_PROXY_URL:-}
      - GEMINI_PROXY_URL=
      - CLAUDE_PROXY_TOKEN=${CLAUDE_PROXY_TOKEN:-}
      - CODEX_PROXY_TOKEN=${CODEX_PROXY_TOKEN:-}
      - GEMINI_PROXY_TOKEN=
      - GW_ENABLE_STREAMING=${GW_ENABLE_STREAMING:-0}
      - GW_ENABLE_BATCH=${GW_ENABLE_BATCH:-0}
      # Disarmed at the source: never a pack input. The native spawn env also
      # force-empties it so an ambient parent token cannot re-arm this route.
      - COUNCIL_GATEWAY_TOKEN=
      - COUNCIL_GATEWAY_KEY_ID=${COUNCIL_GATEWAY_KEY_ID:-}
      - GW_ENABLE_COUNCIL_ENDPOINT=${GW_ENABLE_COUNCIL_ENDPOINT:-0}
      - COUNCIL_BASE_URL=${COUNCIL_BASE_URL:-http://host.docker.internal:8765}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  sidecar:
    image: ${IRIN_SIDECAR_IMAGE:?IRIN_SIDECAR_IMAGE must be a digest-pinned image ref}
    environment:
      - MODELS_JSON_PATH=/conf/models.json
      - SIDECAR_SOCKET_PATH=/run/sidecar/sidecar.sock
      - SIDECAR_SOCKET_MODE=${SIDECAR_SOCKET_MODE:-0660}
      - SIDECAR_SOCKET_GID=${SIDECAR_SOCKET_GID:-9999}
      - WATCH_DB_PATH=/var/lib/sidecar/watch.db
      - COUNCIL_IDEM_DB_PATH=/var/lib/sidecar/council_idem.db
      - LEDGER_DB_PATH=/var/lib/sidecar/ledger.db
      - LEDGER_SIGNING_KEY_PATH=/run/secrets/ledger_key
      - GATEWAY_DURABLE=${GATEWAY_DURABLE:-1}
      - GATEWAY_STATE_DB_PATH=/var/lib/sidecar/gateway.db
      - DECON_CONFIG_PATH=/conf/decon_config.json
      - AUTH_CONFIG_PATH=/var/lib/sidecar/auth_keys.json
      - IP_POLICY_PATH=/conf/ip_policy.json
      - GATEWAY_AUTH_FAIL_CLOSED=${GATEWAY_AUTH_FAIL_CLOSED:-true}
      - AUTH_PEPPER=${AUTH_PEPPER}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      # Watch admin read surface: armed with a Keychain-held token interpolated
      # from the validated native spawn env. Ambient host values are scrubbed
      # before the spawn env is applied; the value never touches the public
      # env file.
      - WATCH_ADMIN_TOKEN=${WATCH_ADMIN_TOKEN:-}
      # Watch producer and dispatcher must remain disarmed in every pack path.
      - WATCH_DISPATCHER_ENABLED=false
      - WATCH_PRODUCER_ENABLED=false
      - WATCH_DISPATCHER_STRICT_BOOT=false
      - WATCH_CANARY_TENANT=${WATCH_CANARY_TENANT:-canary}
      - WATCH_DISPATCHER_GATEWAY_KEY=
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://gateway:8080}
      - DAILY_SPEND_CAP_USD=${DAILY_SPEND_CAP_USD:-25}
      - WATCH_MAX_FANOUT_COST_USD=${WATCH_MAX_FANOUT_COST_USD:-2.50}
      - RECON_CADENCE_SECS=
      - RECON_IMPORT_PATH=
      # Touch ID bridge — the ONLY two arm-surface keys this pack admits.
      # GW_ARM_PRINCIPALS is the Keychain-held custody-domain-1 bearer registry
      # supplied per-spawn by the native host; empty means "no principal", which
      # 401s every arm route. GW_ARM_ATTEST_KEYS_PATH points at the read-only
      # enrollment registry mounted below; an absent/empty/`[]` registry loads
      # UNLOADED, so every local-attest confirm rejects (fail-closed).
      - GW_ARM_PRINCIPALS=${GW_ARM_PRINCIPALS:-}
      - GW_ARM_ATTEST_KEYS_PATH=${GW_ARM_ATTEST_KEYS_PATH:-}
      # Every other arm knob stays an empty literal that accepts no env input.
      - GW_ARM_DEVIATION_FLAG=
      - GW_ARM_PRINCIPAL_DOMAINS=
      - ARM_NOTIFY_URL=
      - ARM_STAGE_TTL_MS=
    volumes:
      - "${IRIN_DESKTOP_PACK_ROOT}/conf:/conf:ro"
      - irin_desktop_sidecar_sock:/run/sidecar
      - irin_desktop_sidecar_data:/var/lib/sidecar
      # App-owned ledger seed only — never the canonical operator ledger key.
      - "${IRIN_DESKTOP_LEDGER_KEY}:/run/secrets/ledger_key:ro"
      # App-owned Touch ID enrollment registry (public credential records only:
      # credential ids, SEC1 public keys, labels, timestamps). Read-only — the
      # sidecar never mutates enrollment, and no private key material exists in
      # this file: the Secure Enclave private key never leaves the host enclave.
      - "${IRIN_DESKTOP_ARM_KEYS}:/run/secrets/arm_attest_keys.json:ro"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/sidecar/sidecar.sock"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s

volumes:
  irin_desktop_sidecar_sock:
  irin_desktop_sidecar_data:
