# IRIN — OpenResty/Lua credential path hygiene.
# credential_scrub.lua must run on outbound bodies before client/cache sinks.
rules:
  - id: irin.lua.credential-path
    message: >-
      Request body/header material flows to an outbound sink without an
      obvious credential_scrub.scrub call in the same function. Scrub before
      ngx.say/print or ledger/cache write of response content.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: redaction
      confidence: low
    patterns:
      - pattern-either:
          - pattern: |
              local $B = ngx.req.get_body_data()
              ...
              ngx.say($B)
          - pattern: |
              local $B = ngx.req.get_body_data()
              ...
              ngx.print($B)
          - pattern: |
              local $H = ngx.req.get_headers()
              ...
              ngx.say($H)
          - pattern: |
              local $B = ngx.req.get_body_data()
              ...
              ngx.log(ngx.ERR, $B)
          - pattern: |
              local $B = ngx.req.get_body_data()
              ...
              ngx.log(ngx.WARN, $B)
          - pattern: |
              local $B = ngx.req.get_body_data()
              ...
              ngx.log(ngx.INFO, $B)
      - pattern-not: |
          ...
          credential_scrub.scrub(...)
          ...

  - id: irin.lua.ngx-log-authorization
    message: >-
      Logging Authorization / API-key header material. Log presence or a
      redacted fingerprint only — never the raw header value.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: log-leak
      confidence: medium
    patterns:
      - pattern-either:
          - pattern: ngx.log($LEVEL, ..., $H["Authorization"], ...)
          - pattern: ngx.log($LEVEL, ..., $H["authorization"], ...)
          - pattern: ngx.log($LEVEL, ..., $H["X-Admin-Key"], ...)
          - pattern: ngx.log($LEVEL, ..., $H["X-Api-Key"], ...)
          - pattern: ngx.log($LEVEL, ..., $H.authorization, ...)
          - pattern: ngx.log($LEVEL, $H["Authorization"])
          - pattern: ngx.log($LEVEL, $H["X-Admin-Key"])
