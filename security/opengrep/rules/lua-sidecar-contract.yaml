# IRIN — B1 boundary contract: OpenResty Lua ↔ sidecar-rs.
# Pins the Lua sidecar_post path set to the sidecar-rs route mounts and
# asserts required top-level JSON body keys on the hot paths.
#
# Key presence uses call-anchored pattern-not-regex that walks only the
# top-level table body while:
#   - skipping one-level nested `{...}` (nested metadata.raw_key is not enough)
#   - skipping Lua line comments (`-- ...`) so comment text cannot suppress
#   - skipping double- and single-quoted string literals so string text cannot
#     suppress
# Extra top-level fields remain allowed.
#
# CEILING (opengrep Lua): this is a lexical walk, not a full AST field check.
# Nested tables deeper than one level, long-bracket strings `[=[...]=]`, and
# pathological quote/escape shapes may still confuse the walker. Negative
# fixtures cover `-- comment` and ordinary "string" contexts for auth/check.
#
# /route/decide builds its body in a local table upstream of the call and is
# covered by the path allowlist only.
rules:
  - id: irin.lua.sidecar-path-allowlist
    message: >-
      sidecar_post path is not in the canonical sidecar-rs route set
      (gateway/sidecar-rs/src/routes/mod.rs). A Lua path without a Rust mount
      fails closed at runtime with no static signal. Either mount the route in
      sidecar-rs and extend this allowlist, or remove the call.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("$PATH", ...)
      - pattern-not: sidecar_post("/guard/input", ...)
      - pattern-not: sidecar_post("/guard/sovereignty", ...)
      - pattern-not: sidecar_post("/auth/check", ...)
      - pattern-not: sidecar_post("/auth/ip-check", ...)
      - pattern-not: sidecar_post("/ledger/record", ...)
      - pattern-not: sidecar_post("/route/decide", ...)
      - pattern-not: sidecar_post("/route/outcome", ...)
      - pattern-not: sidecar_post("/budget/check", ...)
      - pattern-not: sidecar_post("/budget/record", ...)
      - pattern-not: sidecar_post("/policy/evaluate", ...)
      - pattern-not: sidecar_post("/cache/check", ...)
      - pattern-not: sidecar_post("/cache/store", ...)
      - pattern-not: sidecar_post("/council/idempotency/peek", ...)
      - pattern-not: sidecar_post("/council/idempotency/claim", ...)
      - pattern-not: sidecar_post("/council/idempotency/store", ...)
      - pattern-not: sidecar_post("/council/idempotency/fail", ...)
      - pattern-not: sidecar_post("/council/lock", ...)
      - pattern-not: sidecar_post("/council/unlock", ...)
      - pattern-not: sidecar_post("/librarian/commit", ...)

  # Top-level key walk: after the path arg's opening `{`, consume non-brace
  # text, `--` line comments, quoted strings, or a complete one-level nested
  # `{...}` until a real top-level KEY = appears.
  - id: irin.lua.sidecar-auth-check-key-raw_key
    message: >-
      /auth/check body must include top-level raw_key — required keys are
      raw_key and ip (sidecar auth::auth_check contract). Nested fields,
      comments, and string literals containing the key name do not satisfy
      the contract; extra top-level fields are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/auth/check", ...)
      - pattern-not-regex: 'sidecar_post\("/auth/check",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\braw_key\s*='

  - id: irin.lua.sidecar-auth-check-key-ip
    message: >-
      /auth/check body must include top-level ip — required keys are raw_key
      and ip (sidecar auth::auth_check contract). Nested fields, comments,
      and string literals do not satisfy the contract; extra top-level fields
      are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/auth/check", ...)
      - pattern-not-regex: 'sidecar_post\("/auth/check",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\bip\s*='

  - id: irin.lua.sidecar-guard-input-key-content
    message: >-
      /guard/input body must include top-level content — required keys are
      content and source (sidecar guard::guard_input contract). Nested fields,
      comments, and string literals do not satisfy the contract; extra
      top-level fields are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/guard/input", ...)
      - pattern-not-regex: 'sidecar_post\("/guard/input",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\bcontent\s*='

  - id: irin.lua.sidecar-guard-input-key-source
    message: >-
      /guard/input body must include top-level source — required keys are
      content and source (sidecar guard::guard_input contract). Nested fields,
      comments, and string literals do not satisfy the contract; extra
      top-level fields are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/guard/input", ...)
      - pattern-not-regex: 'sidecar_post\("/guard/input",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\bsource\s*='

  - id: irin.lua.sidecar-budget-check-key-budget_key
    message: >-
      /budget/check body must include top-level budget_key — required keys are
      budget_key and estimated_cost (sidecar budget::budget_check contract).
      Nested fields, comments, and string literals do not satisfy the contract;
      extra top-level fields are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/budget/check", ...)
      - pattern-not-regex: 'sidecar_post\("/budget/check",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\bbudget_key\s*='

  - id: irin.lua.sidecar-budget-check-key-estimated_cost
    message: >-
      /budget/check body must include top-level estimated_cost — required keys
      are budget_key and estimated_cost (sidecar budget::budget_check contract).
      Nested fields, comments, and string literals do not satisfy the contract;
      extra top-level fields are allowed.
    severity: WARNING
    languages: [lua]
    metadata:
      irin.surface: gateway-lua
      irin.category: contract
      irin.boundary: B1
    patterns:
      - pattern: sidecar_post("/budget/check", ...)
      - pattern-not-regex: 'sidecar_post\("/budget/check",\s*\{(?:[^{}"''\-]|-(?!-)|--[^\n]*\n|"[^"\\]*(?:\\.[^"\\]*)*"|''[^''\\]*(?:\\.[^''\\]*)*''|\{[^{}]*\})*\bestimated_cost\s*='
