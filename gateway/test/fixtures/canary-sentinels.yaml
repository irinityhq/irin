# Canary provision fixture (committed).
# One deterministic file-inbox sentinel loaded by the canary overlay
# (docker-compose.canary.yml), which mounts this file read-only and points
# SENTINELS_CONFIG_PATH here so the sidecar boots with a non-empty registry
# for deterministic local runtime testing.
#
# Uses a dedicated `canary` tenant so canary fires never collide with
# smoke-test rows. The controlled fire is operator-driven: drop a single
# `*.txt` into the inbox bind mount to fire exactly once. The overlay runs
# the watcher only — the producer and dispatcher stay off, so a fire is
# recorded without starting spend or dispatching directives.
#
# Longer cooldown than the smoke fixture: single-fire discipline, not
# responsive re-polling — one controlled fire per operator action.
- name: file-inbox-watch
  tenant: canary
  tier: polling
  cooldown_ms: 30000
  config:
    path: /var/lib/gateway/inbox
    patterns: ["*.txt"]
    debounce_ms: 500
